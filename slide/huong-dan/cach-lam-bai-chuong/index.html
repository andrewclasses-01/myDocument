<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="mydocument:id" content="slide/huong-dan/cach-lam-bai-chuong">
<title>Hướng dẫn cách làm bài tập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2B30;--muted:#5F7370;--teal:#0E7C6E;--orange:#F08A2C;--xanh:#22A45D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:'Montserrat','Segoe UI',system-ui,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
html.nhung,html.nhung body{overflow:hidden}
html.nhung body{min-height:0;display:block}
#app{width:min(100vw,1100px,calc((100vh - 190px) * 16 / 9));min-width:300px;display:flex;flex-direction:column;background:#fff;
  border-radius:16px;overflow:hidden;user-select:none;-webkit-user-select:none}
html.nhung #app{width:100%;border-radius:0}

/* ---------- khung cảnh 16:9 (vẽ ở 1920×1080 rồi thu/phóng) ---------- */
#khung{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:radial-gradient(900px 600px at 10% 0%,#FFE7C4 0%,transparent 60%),radial-gradient(900px 700px at 100% 100%,#D9F0EA 0%,transparent 62%),linear-gradient(160deg,#FFF9F0,#FFF3E2 60%,#FDF0DE)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;opacity:0;transform:translateX(7%) scale(.96);filter:blur(6px);
  transition:opacity .55s cubic-bezier(.22,.9,.3,1),transform .7s cubic-bezier(.22,.9,.3,1),filter .55s;pointer-events:none}
.slide.on{opacity:1;transform:none;filter:none}
.slide.ra{opacity:0;transform:translateX(-7%) scale(.96);filter:blur(6px)}
.slide.ra.lui{transform:translateX(7%) scale(.96)}
.slide.vao-lui{transform:translateX(-7%) scale(.96)}
.slide svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slide svg text{font-family:'Montserrat','Segoe UI',system-ui,sans-serif}
.slide svg .a{transform-box:fill-box;transform-origin:center}
.slide:not(.chay) .a{animation:none!important}
/* slogan ANDREW CLASSES — chữ mảnh như slogan trên AWord (.aw-rv-brand: weight 300, giãn chữ .32em, xám nhạt) */
.slide svg text.slogan{font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:300;letter-spacing:.32em}
#so{position:absolute;right:22px;top:16px;font:800 13px Montserrat,sans-serif;color:rgba(30,43,48,.4);letter-spacing:.12em;z-index:2}

/* ---------- chữ (HTML, cỡ thật — đọc được trên điện thoại) ---------- */
#chu{padding:16px 22px 6px}
#buoc{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--teal)}
#tieu{font-size:22px;font-weight:900;line-height:1.2;margin:3px 0 6px}
#noi{font-size:15.5px;line-height:1.55;color:#33454B;font-weight:500}
#noi b{color:#C05F10;font-weight:800}
#chu.doi #buoc,#chu.doi #tieu,#chu.doi #noi{animation:chuVao .55s cubic-bezier(.22,.9,.3,1) both}
#chu.doi #tieu{animation-delay:.05s}#chu.doi #noi{animation-delay:.1s}
@keyframes chuVao{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- điều khiển ---------- */
#dk{display:flex;align-items:center;gap:10px;padding:10px 16px 16px}
#lui{width:46px;height:46px;border-radius:14px;border:1.5px solid #dfe6e4;background:#fff;color:var(--ink);font:800 20px inherit;cursor:pointer;flex:none}
#lui:disabled{opacity:.35;cursor:default}
#cham{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
#cham i{width:9px;height:9px;border-radius:50%;background:#e2e8e6;transition:all .3s}
#cham i.da{background:#9fd8b8}
#cham i.on{background:var(--teal);width:24px;border-radius:9px}
#hieu{position:relative;min-width:170px;height:50px;border-radius:14px;border:2px solid #cfe5d8;background:#fff;color:#7a8c88;
  font:900 15px 'Montserrat',sans-serif;letter-spacing:.06em;cursor:not-allowed;overflow:hidden;flex:none;padding:0 18px}
#hieu .day{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#9fe0b8,#5cc98a)}
#hieu .nhan{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
#hieu.san{background:var(--xanh);border-color:var(--xanh);color:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(34,164,93,.35);animation:sanSang 1.6s ease-in-out infinite}
#hieu.san .day{display:none}
@keyframes sanSang{50%{transform:translateY(-2px);box-shadow:0 12px 26px rgba(34,164,93,.45)}}
@media (max-width:520px){
  #chu{padding:12px 14px 4px} #tieu{font-size:18px} #noi{font-size:14px}
  #dk{padding:8px 10px 12px;gap:8px} #hieu{min-width:140px;height:46px;font-size:14px} #lui{width:42px;height:42px}
  #cham i{width:7px;height:7px} #cham i.on{width:16px}
}

/* ================= HOẠT HÌNH (vòng lặp — chỉ chạy khi trang đang mở) ================= */
@keyframes noi{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes thoNhe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gatDau{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
@keyframes nhay{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes vongBam{0%{opacity:0;transform:scale(.4)}15%{opacity:.9}100%{opacity:0;transform:scale(1.9)}}
/* trang 3 — đọc sách & suy ngẫm */
@keyframes latTrang{0%,40%{transform:scaleX(1)}55%{transform:scaleX(-1)}70%,100%{transform:scaleX(-1);opacity:0}}
@keyframes chuBay{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes may{0%,6%{opacity:0;transform:scale(.6)}14%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes go1{0%,16%{transform:scaleX(1)}38%,100%{transform:scaleX(0)}}
@keyframes go2{0%,40%{transform:scaleX(1)}62%,100%{transform:scaleX(0)}}
@keyframes nutDoc{0%,66%{opacity:0;transform:scale(.6)}72%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes bamDoc{0%,78%{opacity:0;transform:scale(.4)}81%{opacity:.9}92%,100%{opacity:0;transform:scale(1.9)}}
@keyframes docXanh{0%,80%{fill:#0E7C6E}82%,100%{fill:#22A45D}}
/* trang 4 — tự luyện */
@keyframes dapAnC{0%,38%{opacity:0}42%,92%{opacity:1}100%{opacity:0}}
@keyframes bamC{0%,32%{opacity:0;transform:scale(.4)}35%{opacity:.9}46%,100%{opacity:0;transform:scale(1.9)}}
@keyframes diem100{0%,56%{opacity:0;transform:scale(.4)}62%,92%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes ngonC{0%,10%{transform:translate(90px,160px)}30%,40%{transform:translate(0,0)}52%,100%{transform:translate(90px,160px)}}
/* trang 5/7 — bong bóng "bố mẹ nhìn thấy" */
@keyframes luot{0%,8%{transform:translateY(0)}24%,100%{transform:translateY(-26px)}}
@keyframes ngonB{0%,6%{transform:translate(20px,140px)}24%{transform:translate(10px,90px)}40%,54%{transform:translate(58px,-4px)}58%{transform:translate(58px,6px)}64%,100%{transform:translate(58px,-4px)}}
@keyframes chonB{0%,57%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
@keyframes vongB{0%,56%{opacity:0;transform:scale(.4)}60%{opacity:.9}72%,100%{opacity:0;transform:scale(1.8)}}
@keyframes boHoi{0%,4%{opacity:0;transform:scale(.6)}10%,28%{opacity:1;transform:scale(1)}34%,100%{opacity:0;transform:scale(.6)}}
@keyframes conNoi{0%,30%{opacity:0;transform:scale(.6)}36%,80%{opacity:1;transform:scale(1)}88%,100%{opacity:0;transform:scale(.6)}}
@keyframes miengMo{0%,32%{opacity:0}34%,78%{opacity:1}80%,100%{opacity:0}}
/* trang 6 — video mẫu */
@keyframes chay100{0%,6%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
@keyframes xongVid{0%,70%{opacity:0;transform:scale(.5)}76%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes anPlay{0%,5%{opacity:1}9%,96%{opacity:0}100%{opacity:1}}
/* trang 8 — Zalo */
@keyframes bayVao{0%{transform:translate(540px,260px) scale(.35) rotate(14deg);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
@keyframes manA{0%,24%{opacity:1}27%,97%{opacity:0}100%{opacity:1}}
@keyframes manB{0%,25%{opacity:0}28%,50%{opacity:1}53%,100%{opacity:0}}
@keyframes manC{0%,51%{opacity:0}54%,94%{opacity:1}97%,100%{opacity:0}}
@keyframes bamA{0%,12%{opacity:0;transform:scale(.4)}15%{opacity:.9}24%,100%{opacity:0;transform:scale(1.9)}}
@keyframes bamB{0%,38%{opacity:0;transform:scale(.4)}41%{opacity:.9}50%,100%{opacity:0;transform:scale(1.9)}}
@keyframes chonVid{0%,64%{opacity:0;transform:scale(.3)}67%,94%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
@keyframes bamGui{0%,76%{opacity:0;transform:scale(.4)}79%{opacity:.9}88%,100%{opacity:0;transform:scale(1.9)}}
@keyframes daGui{0%,84%{opacity:0;transform:translateY(20px)}87%,94%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes buoc1{0%,26%{opacity:1}29%,100%{opacity:.28}}
@keyframes buoc2{0%,26%{opacity:.28}29%,51%{opacity:1}54%,100%{opacity:.28}}
@keyframes buoc3{0%,52%{opacity:.28}55%,95%{opacity:1}98%,100%{opacity:.28}}
@keyframes ngonTay{0%,8%{transform:translate(200px,470px)}12%,19%{transform:translate(150px,140px)}30%,34%{transform:translate(320px,600px)}38%,47%{transform:translate(349px,726px)}57%,60%{transform:translate(150px,470px)}63%,70%{transform:translate(62px,424px)}74%,86%{transform:translate(352px,322px)}94%,100%{transform:translate(200px,470px)}}
</style>
<style id="kfDong"></style>
</head>
<body>
<div id="app">
  <div id="khung"><div id="stage"></div><div id="so"></div></div>
  <div id="chu"><div id="buoc"></div><div id="tieu"></div><div id="noi"></div></div>
  <div id="dk">
    <button id="lui" type="button" title="Trang trước">‹</button>
    <div id="cham"></div>
    <button id="hieu" type="button"><span class="day"></span><span class="nhan">ĐÃ HIỂU</span></button>
  </div>
</div>

<script src="../../../_chung/nhung.js"></script>
<script>
'use strict';
/* =====================================================================
   Hướng dẫn cách làm bài tập — SLIDE ĐỘNG cho phụ huynh (v1.1.0, thầy góp ý 11/10/2026 tối)
   · Mỗi trang: cảnh hoạt hình lặp (CSS animation, chỉ chạy khi trang đang mở) + chữ HTML cỡ thật.
   · Slogan ANDREW CLASSES chữ mảnh giữa hàng trên cùng mọi trang.
   · Nút ĐÃ HIỂU chạy màu trắng → xanh lá theo thời gian đọc trang, đầy mới bấm được.
   · Nhắn trang mẹ (hợp đồng myDocument): ready · chapter · progress{pct} · ended + riêng `cao` {cao}.
   ===================================================================== */
const MD=window.MyDocument||{nhung:false,q:new URLSearchParams(location.search),emit(){},onLenh(){}};
const $=(q,r=document)=>r.querySelector(q);
const C={ink:'#1E2B30',muted:'#5F7370',teal:'#0E7C6E',tealS:'#DDF1EC',orange:'#F08A2C',orangeS:'#FDE6CC',red:'#C2410C',yellow:'#F6CF2E',
  green:'#1F5A2E',wood:'#C98B55',wood2:'#A86C3D',woodHi:'#D9A06C',line:'#E6D8C4',dark:'#2A3236',zalo:'#0091FF',xanh:'#22A45D'};

/* ================= HÀM VẼ CHUNG ================= */
const G=(x,y,inner,cls='',sc=1,rot=0,st='')=>`<g transform="translate(${x} ${y})${sc!==1?` scale(${sc})`:''}${rot?` rotate(${rot})`:''}"><g class="${cls?'a '+cls:''}"${st?` style="${st}"`:''}>${inner}</g></g>`;
const A=(st,inner)=>`<g class="a" style="${st}">${inner}</g>`;
const TX=(x,y,s,size=32,fill=C.ink,o={})=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.cls?` class="${o.cls}"`:''}>${s}</text>`;
const RR=(x,y,w,h,r,fill,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"${o.st?` stroke="${o.st}" stroke-width="${o.sw||3}"`:''}${o.style?` style="${o.style}"`:''}/>`;
const CHECK=(r=26,bg=C.xanh)=>`<circle r="${r}" fill="${bg}"/><path d="M${-r*.42} 0 L${-r*.1} ${r*.32} L${r*.45} ${-r*.34}" fill="none" stroke="#fff" stroke-width="${r*.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
const LOCK=(col='#C9707E',s=1)=>`<g transform="scale(${s})"><path d="M-10 -4 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="${col}" stroke-width="5"/><rect x="-15" y="-5" width="30" height="24" rx="6" fill="${col}"/></g>`;
const VONG=(st,col=C.orange)=>A(st,`<circle r="34" fill="none" stroke="${col}" stroke-width="7"/>`);
const SLOGAN=`<text x="960" y="66" font-size="30" fill="#9aa3af" text-anchor="middle" class="slogan">ANDREW CLASSES</text>`;
/* bàn: mặt bàn có cạnh sáng + bóng dưới */
const BAN=(y=860,x0=-40,x1=1960)=>`<rect x="${x0}" y="${y+26}" width="${x1-x0}" height="400" fill="${C.wood2}"/><rect x="${x0}" y="${y}" width="${x1-x0}" height="34" rx="10" fill="${C.wood}"/><rect x="${x0}" y="${y}" width="${x1-x0}" height="8" rx="4" fill="${C.woodHi}"/><rect x="${x0}" y="${y+34}" width="${x1-x0}" height="14" fill="rgba(0,0,0,.12)"/>`;
/* bàn tay chỉ (đầu ngón trỏ ở 0,0) */
const NGON=(sc=1)=>`<g transform="scale(${sc})"><path d="M-6 0 Q-12 2 -12 14 L-12 58 Q-26 50 -34 58 Q-42 68 -30 80 L-2 110 Q6 118 18 118 L44 118 Q64 118 66 92 L66 50 Q66 38 54 38 Q46 38 44 46 Q42 32 30 32 Q22 32 20 40 Q18 30 8 30 Q2 30 0 34 L0 8 Q0 -2 -6 0Z" fill="#F7CDA6" stroke="#C98D5E" stroke-width="4" stroke-linejoin="round"/><path d="M20 40 L20 62 M44 46 L44 66" stroke="#C98D5E" stroke-width="3" stroke-linecap="round" opacity=".6"/></g>`;

/* ---------- SÁCH NỀN TẢNG TIẾNG ANH ---------- */
function BOOK(w=220,h=300){
  return `<g><rect x="${-w/2+10}" y="${-h/2+12}" width="${w}" height="${h}" rx="10" fill="rgba(0,0,0,.12)"/>
   <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="10" fill="${C.yellow}"/>
   <rect x="${-w/2}" y="${-h/2+h*.62}" width="${w}" height="${h*.38}" rx="10" fill="${C.green}"/><rect x="${-w/2}" y="${-h/2+h*.62}" width="${w}" height="10" fill="${C.green}"/>
   <rect x="${-w/2}" y="${-h/2+h*.6}" width="${w}" height="8" fill="${C.orange}"/>
   ${TX(0,-h/2+h*.115,'ANDREW CLASSES',w*.065,'#1b2a5a',{w:800})}
   ${TX(0,-h/2+h*.28,'NỀN TẢNG',w*.15,C.red,{w:900})}${TX(0,-h/2+h*.42,'TIẾNG ANH',w*.15,C.red,{w:900})}
   ${TX(0,-h/2+h*.78,'Dành cho học sinh',w*.072,C.yellow,{w:800})}${TX(0,-h/2+h*.86,'mới bắt đầu',w*.072,C.yellow,{w:800})}</g>`;
}
/* ---------- MÁY (màn hình quay về người xem) ---------- */
function DEVICE(w,h,inner,b=22,id=''){
  return `<g><rect x="${-w/2+8}" y="${-h/2+12}" width="${w}" height="${h}" rx="${b+12}" fill="rgba(0,0,0,.15)"/>
   <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${b+12}" fill="${C.dark}"/><rect x="${-w/2+3}" y="${-h/2+3}" width="${w-6}" height="${h-6}" rx="${b+9}" fill="none" stroke="#4a545a" stroke-width="2"/>
   <g transform="translate(${-w/2+b} ${-h/2+b})">${id?`<clipPath id="${id}"><rect width="${w-2*b}" height="${h-2*b}" rx="12"/></clipPath><g clip-path="url(#${id})">`:'<g>'}<rect width="${w-2*b}" height="${h-2*b}" rx="12" fill="#fff"/>${inner}</g></g></g>`;
}
/* ---------- MẶT SAU iPad (màn hình quay về người cầm) ---------- */
function IPAD_LUNG(w=300,h=210){
  return `<g><rect x="${-w/2+6}" y="${-h/2+10}" width="${w}" height="${h}" rx="26" fill="rgba(0,0,0,.18)"/>
   <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="26" fill="#8E9AA2"/>
   <rect x="${-w/2+8}" y="${-h/2+8}" width="${w-16}" height="${h-16}" rx="20" fill="#A9B4BB"/>
   <path d="M${-w/2+14} ${-h/2+30} Q${-w/2+14} ${-h/2+14} ${-w/2+30} ${-h/2+14} L${w/2-60} ${-h/2+14}" stroke="#fff" stroke-width="5" opacity=".35" fill="none" stroke-linecap="round"/>
   <rect x="${-w/2+18}" y="${-h/2+18}" width="38" height="38" rx="11" fill="#3a4246"/><circle cx="${-w/2+37}" cy="${-h/2+37}" r="9" fill="#11161a"/><circle cx="${-w/2+34}" cy="${-h/2+34}" r="3" fill="#6f8db3"/>
   <circle cx="0" cy="4" r="20" fill="#97A3AA"/></g>`;
}
/* iPad nhìn NGHIÊNG (người cầm ở bên trái, màn hình hướng về họ) — một tấm mỏng nghiêng */
function IPAD_NGHIENG(){
  return `<g><path d="M0 0 L26 -150 L44 -146 L18 6 Z" fill="#8E9AA2"/><path d="M0 0 L26 -150 L30 -149 L4 1Z" fill="#2A3236"/></g>`;
}
/* ---------- bài trắc nghiệm (hệ 776×516) ---------- */
function QUIZ0(o={}){
  const top=14,ow=(776-54)/2,oh=(516-top-130)/2-12;
  const opt=i=>{const x=18+(i%2)*(ow+18),y=top+108+Math.floor(i/2)*(oh+16),L='ABCD'[i],ok=o.dung===i;
    return `<g>${RR(x,y,ow,oh,16,'#fff',{st:'#dfe6e4',sw:3})}${RR(x+16,y+oh/2-24,48,48,12,'#eef3f2')}${TX(x+40,y+oh/2+11,L,28,C.muted,{w:800})}${RR(x+80,y+oh/2-8,ow*.5,16,8,'#dfe6e4')}
     ${ok?A(o.stDung||'',`${RR(x,y,ow,oh,16,'#E3F5EE',{st:C.xanh,sw:5})}${RR(x+16,y+oh/2-24,48,48,12,C.xanh)}${TX(x+40,y+oh/2+11,L,28,'#fff',{w:800})}<g transform="translate(${x+ow-44} ${y+oh/2})">${CHECK(22)}</g>`):''}</g>`};
  return `${RR(18,top,740,92,16,C.tealS)}${TX(40,top+40,'Câu 12.',26,C.teal,{a:'start',w:900})}${RR(150,top+26,420,14,7,'#9fcfc5')}${RR(40,top+60,300,14,7,'#9fcfc5')}${[0,1,2,3].map(opt).join('')}`;
}
const QUIZ=(w,h,o={})=>`<g transform="scale(${(w/776).toFixed(4)} ${(h/516).toFixed(4)})">${QUIZ0(o)}</g>`;

/* ================= NHÂN VẬT =================
   Gốc toạ độ: giữa ngực (y=0), đầu ở (0,-225). Bàn thường che từ ngực xuống.
   o: {tre|lon, da, toc, ao, nhin:[dx,dy] (con ngươi), mieng:'cuoi'|'mo'|'noi', tay:{trai:[khuyu,ban tay], phai:[…]}} */
const DA={tre:'#F9D2B0',lon:'#EDBE95'}, DA2={tre:'#EDB48C',lon:'#D99E73'};
function MAT(o){
  const [dx,dy]=o.nhin||[0,0];
  const mat=x=>`<ellipse cx="${x}" cy="-222" rx="13" ry="15" fill="#fff"/><circle cx="${x+dx}" cy="${-220+dy}" r="9" fill="#3B2416"/><circle cx="${x+dx+3}" cy="${-224+dy}" r="3.2" fill="#fff"/><path d="M${x-14} -230 Q${x} -240 ${x+14} -230" fill="none" stroke="#3B2416" stroke-width="3.5" stroke-linecap="round"/>`;
  const mieng=o.mieng==='mo'
    ?`<path d="M-22 -180 Q0 -144 22 -180 Z" fill="#8A2E22"/><path d="M-16 -179 L16 -179 L14 -173 L-14 -173Z" fill="#fff"/><path d="M-11 -162 Q0 -168 11 -162 Q0 -156 -11 -162Z" fill="#E66A5C"/>`
    :`<path d="M-22 -182 Q0 -160 22 -182" fill="none" stroke="#8A2E22" stroke-width="6" stroke-linecap="round"/>`;

/* cánh tay: vai → khuỷu → bàn tay; tay áo ngắn rồi da */

/* ---------- BONG BÓNG suy nghĩ / "người cầm máy nhìn thấy" ----------
   tâm (cx,cy), bán kính r; dauNguoi = điểm trên đỉnh đầu người — 2 chấm nối nằm ĐÚNG trên đường thẳng đầu → bong bóng. */
function BONG_TRON(cx,cy,r,id,dauNguoi,noiDung){
  const [hx,hy]=dauNguoi,vx=cx-hx,vy=cy-hy,d=Math.hypot(vx,vy),ux=vx/d,uy=vy/d;
  const c1=[hx+ux*(d-r)*.28,hy+uy*(d-r)*.28],c2=[hx+ux*(d-r)*.62,hy+uy*(d-r)*.62];
  return `<g><circle cx="${c1[0].toFixed(1)}" cy="${c1[1].toFixed(1)}" r="${(r*.06).toFixed(1)}" fill="#fff" stroke="${C.teal}" stroke-width="4"/>
    <circle cx="${c2[0].toFixed(1)}" cy="${c2[1].toFixed(1)}" r="${(r*.1).toFixed(1)}" fill="#fff" stroke="${C.teal}" stroke-width="4"/>
    <circle cx="${cx}" cy="${cy+10}" r="${r+10}" fill="rgba(0,0,0,.07)"/>
    <clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>
    <circle cx="${cx}" cy="${cy}" r="${r+7}" fill="#fff" stroke="${C.teal}" stroke-width="6"/>
    <g clip-path="url(#${id})"><g transform="translate(${cx} ${cy}) scale(${(r/200).toFixed(4)})">${noiDung}</g></g></g>`;
}

/* ================= ĐIỀU KHIỂN ================= */
const stage=$('#stage'),khung=$('#khung'),hieu=$('#hieu'),day=$('.day',hieu),nhan=$('.nhan',hieu);
const NHANH=MD.q.get('nhanh')==='1';
SL.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide';
  d.innerHTML=`<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${s.svg()}</svg>`;
  stage.appendChild(d);s.el=d;
  const chu=s.noi.replace(/<[^>]+>/g,'').trim().split(/\s+/).length;
  s.cho=NHANH?0.6:Math.min(12,Math.max(5,chu*0.22));   /* giây chờ trước khi bấm được ĐÃ HIỂU */
});
$('#cham').innerHTML=SL.map(()=>'<i></i>').join('');
const DOT=[...$('#cham').children];
let cur=-1,daHieu=new Set(),hen=null,batDau=0,ketThuc=false;
function fit(){stage.style.transform=`scale(${khung.clientWidth/1920})`;baoCao()}
function baoCao(){MD.emit('cao',{cao:Math.ceil($('#app').getBoundingClientRect().height)+2})}
function veNut(){
  const xong=daHieu.has(cur);
  hieu.classList.toggle('san',xong);
  nhan.textContent=xong?(cur===SL.length-1?'ĐÃ HIỂU HẾT ✓':'ĐÃ HIỂU ›'):'ĐÃ HIỂU';
}
function demGio(){
  cancelAnimationFrame(hen);
  if(daHieu.has(cur)){day.style.width='100%';veNut();return}
  batDau=performance.now();
  const s=SL[cur];
  const buoc=()=>{
    const p=Math.min(1,(performance.now()-batDau)/1000/s.cho);
    day.style.width=(p*100)+'%';
    if(p>=1){daHieu.add(cur);veNut();DOT[cur].classList.add('da');return}
    hen=requestAnimationFrame(buoc);
  };
  veNut();hen=requestAnimationFrame(buoc);
}
function den(i,lui){
  if(i<0||i>=SL.length||i===cur)return;
  const cu=cur>=0?SL[cur].el:null;
  if(cu){cu.classList.remove('on','chay');cu.classList.add('ra');cu.classList.toggle('lui',!!lui);setTimeout(()=>cu.classList.remove('ra','lui'),750)}
  cur=i;const s=SL[i],el=s.el;
  el.classList.remove('ra','lui');el.classList.toggle('vao-lui',!!lui);void el.offsetWidth;
  el.classList.remove('vao-lui');el.classList.add('on');
  requestAnimationFrame(()=>el.classList.add('chay'));
  $('#buoc').textContent=s.buoc;$('#tieu').textContent=s.tieu;$('#noi').innerHTML=s.noi;
  const chu=$('#chu');chu.classList.remove('doi');void chu.offsetWidth;chu.classList.add('doi');
  $('#so').textContent=(i+1)+' / '+SL.length;
  DOT.forEach((d,k)=>d.classList.toggle('on',k===i));
  $('#lui').disabled=i===0;
  day.style.width='0';demGio();
  MD.emit('chapter',{chuong:i,ten:s.tieu,tong_chuong:SL.length});
  setTimeout(baoCao,60);
}
function tiep(){
  if(!daHieu.has(cur))return;
  if(cur===SL.length-1){
    if(!ketThuc){ketThuc=true;MD.emit('progress',{t:SL.length,tong:SL.length,pct:100});MD.emit('ended')}
    nhan.textContent='ĐÃ XEM HẾT ✓';return;
  }
  MD.emit('progress',{t:cur+1,tong:SL.length,pct:Math.round((cur+1)/SL.length*100)});
  den(cur+1);
}
hieu.onclick=tiep;
$('#lui').onclick=()=>den(cur-1,true);
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='Enter')tiep();else if(e.key==='ArrowLeft')den(cur-1,true)});
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(document.body);
MD.onLenh((lenh,m)=>{if(lenh==='chuong'&&isFinite(m.i)&&(m.i|0)<=Math.max(...daHieu,0)+1)den(m.i|0,(m.i|0)<cur)});
window.__slide={den,get cur(){return cur},SL,daHieu};
fit();den(0);
MD.emit('ready',{tong_chuong:SL.length,tong:SL.length});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(baoCao);
</script>
