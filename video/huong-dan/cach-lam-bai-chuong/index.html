<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="mydocument:id" content="video/huong-dan/cach-lam-bai-chuong">
<title>Cách làm bài một chương sách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2B30;--muted:#5F7370;--accent:#0E7C6E;--orange:#F08A2C;--cream:#FFF7EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b2427;color:var(--ink);font-family:'Montserrat','Segoe UI',system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:#1b2427}
#player{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--cream);overflow:hidden;user-select:none;-webkit-user-select:none;container-type:inline-size}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}

/* ---------- nền sáng ấm ---------- */
#bg{position:absolute;inset:0;background:
  radial-gradient(1100px 760px at 8% 6%,#FFE7C4 0%,transparent 60%),
  radial-gradient(1000px 820px at 96% 98%,#D9F0EA 0%,transparent 62%),
  linear-gradient(160deg,#FFF9F0,#FFF3E2 60%,#FDF0DE)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 26s ease-in-out infinite alternate}
.blob.b1{width:620px;height:620px;left:-160px;top:-200px;background:#FFC98A}
.blob.b2{width:560px;height:560px;right:-140px;bottom:-200px;background:#8FD3C6;animation-duration:32s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,-70px) scale(1.18)}}
#stage.paused .blob{animation-play-state:paused}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(240,138,44,.16) 1.6px,transparent 1.8px);background-size:54px 54px;-webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}

/* ---------- cảnh ---------- */
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg [data-fx]{transform-box:fill-box;transform-origin:center}
svg text{font-family:'Montserrat','Segoe UI',system-ui,sans-serif}

/* ---------- tiêu đề cảnh ---------- */
#head{position:absolute;left:100px;top:56px;pointer-events:none}
#head .k{font-size:24px;letter-spacing:.24em;font-weight:800;color:var(--accent)}
#head .t{font-size:58px;font-weight:900;line-height:1.1;margin-top:8px;color:var(--ink)}
#head.in .k{animation:hin .8s cubic-bezier(.2,.8,.2,1) both}
#head.in .t{animation:hin .8s .12s cubic-bezier(.2,.8,.2,1) both}
@keyframes hin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#brand{position:absolute;right:100px;top:72px;font-size:19px;letter-spacing:.3em;font-weight:800;color:rgba(30,43,48,.45);text-align:right}
#brand b{color:var(--orange)}

/* ---------- phụ đề ---------- */
#capwrap{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(to top,rgba(255,250,242,.97),rgba(255,250,242,.85) 60%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:0 150px 58px;pointer-events:none}
#cap{font-size:44px;line-height:1.3;font-weight:700;text-align:center;max-width:1620px}
#cap .w{color:rgba(30,43,48,.3);transition:color .25s}
#cap .w.on{color:#1E2B30}
#cap .w.k{color:rgba(240,138,44,.4)}
#cap .w.k.on{color:#D9701A}
#stage.nocc #capwrap{display:none}

/* ---------- thanh điều khiển ---------- */
#ctrl{position:absolute;left:0;right:0;bottom:0;padding:38px 16px 10px;background:linear-gradient(transparent,rgba(20,28,31,.82));display:flex;flex-direction:column;gap:4px;transition:opacity .35s;z-index:6}
#player.idle.playing #ctrl{opacity:0;pointer-events:none}
#player.idle.playing{cursor:none}
#bar{display:flex;gap:3px;height:18px;align-items:center;cursor:pointer;position:relative;touch-action:none}
.seg{flex:1 1 0;height:5px;background:rgba(255,255,255,.3);border-radius:3px;position:relative;overflow:hidden;transition:height .12s}
#bar:hover .seg,#bar.drag .seg{height:9px}
.seg i{position:absolute;top:0;bottom:0;left:0;width:0;background:#35d0bd}
#row{display:flex;align-items:center;gap:4px}
button.ib{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
button.ib:hover{background:rgba(255,255,255,.15)}
button.ib.off{opacity:.4}
button.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.ib svg .f{fill:currentColor;stroke:none}
#time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:#e6f2ef;margin:0 8px 0 6px;white-space:nowrap}
#chap{font-size:14px;color:#cfe3de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#spd{font:700 13px 'Montserrat','Segoe UI',sans-serif;color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:7px 10px;cursor:pointer;margin-right:4px}
#spd:hover{background:rgba(255,255,255,.25)}
#tip{position:absolute;bottom:56px;transform:translateX(-50%);background:rgba(20,28,31,.95);color:#fff;padding:6px 11px;border-radius:8px;font-size:13px;font-weight:600;display:none;white-space:nowrap;z-index:7;pointer-events:none}

/* ---------- màn mở / màn cuối ---------- */
.ovl{position:absolute;inset:0;z-index:5;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 50%,rgba(255,247,236,.05),rgba(30,43,48,.35))}
.ovl.hide{display:none}
.ovl .box{display:grid;justify-items:center;gap:2cqw}
.bigplay{width:min(10vw,17vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#12A08D,#0E7C6E);color:#fff;box-shadow:0 12px 40px rgba(14,124,110,.45);animation:ring 2.2s infinite}
.bigplay svg{width:42%;height:42%}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(14,124,110,.5),0 12px 40px rgba(14,124,110,.4)}70%{box-shadow:0 0 0 min(3vw,5vh) rgba(14,124,110,0),0 12px 40px rgba(14,124,110,.4)}100%{box-shadow:0 0 0 0 rgba(14,124,110,0),0 12px 40px rgba(14,124,110,.4)}}
.ovl .lab{font-weight:900;font-size:min(2vw,3.6vh);letter-spacing:.04em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
#poster{place-items:end end;padding:0 7% 8% 0}
#poster .bigplay{width:min(7.5vw,13vh)}
@media (max-width:700px){#chap{display:none}#brand{display:none}}
html.nhung #brand{display:none}
</style>
</head>
<body>
<div id="wrap">
<div id="player" class="idle">
  <div id="stage" class="paused">
    <div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div id="dots"></div></div>
    <div id="scenes"></div>
    <div id="head"><div class="k"></div><div class="t"></div></div>
    <div id="brand"><b>ANDREW CLASSES</b> &nbsp;·&nbsp; NỀN TẢNG</div>
    <div id="capwrap"><div id="cap"></div></div>
  </div>

  <div id="poster" class="ovl">
    <div class="box">
      <div class="bigplay"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.2v15.6a1 1 0 0 0 1.5.9l13-7.8a1 1 0 0 0 0-1.7l-13-7.8A1 1 0 0 0 7 4.2z"/></svg></div>
      <div class="lab">XEM HƯỚNG DẪN</div>
    </div>
  </div>
  <div id="endcard" class="ovl hide">
    <div class="box">
      <div class="bigplay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></div>
      <div class="lab">XEM LẠI</div>
    </div>
  </div>

  <div id="tip"></div>
  <div id="ctrl">
    <div id="bar"></div>
    <div id="row">
      <button class="ib" id="bPlay" title="Phát / Dừng (Space)"></button>
      <button class="ib" id="bBack" title="Lùi 5 giây (←)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <span id="time">0:00 / 0:00</span>
      <span id="chap"></span>
      <button id="spd" title="Tốc độ">1×</button>
      <button class="ib" id="bCC" title="Phụ đề (C)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.2a2.2 2.2 0 1 0 0 3.6M16.5 10.2a2.2 2.2 0 1 0 0 3.6"/></svg></button>
      <button class="ib" id="bFull" title="Toàn màn hình (F)"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    </div>
  </div>
</div>
</div>

<script src="../../../_chung/nhung.js"></script>
<script>
'use strict';
/* =====================================================================
   Cách làm bài một chương sách — video hướng dẫn phụ huynh (chỉ phụ đề)
   Động cơ giống video/khoa-hoc/bones-muscles: mọi hiệu ứng là Web Animation
   tạm dừng, currentTime do MỘT đồng hồ chính đặt ⇒ phát/dừng/tua/tốc độ chính xác.
   Bỏ giọng đọc + nhạc nền (thầy chốt 11/10/2026: chỉ phụ đề).
   ===================================================================== */
const MD=window.MyDocument||{nhung:false,q:new URLSearchParams(location.search),emit(){},onLenh(){}};
const $=(q,r=document)=>r.querySelector(q);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const f1=n=>Math.round(n*10)/10;

/* ---------- màu ---------- */
const C={ink:'#1E2B30',muted:'#5F7370',teal:'#0E7C6E',teal2:'#12A08D',tealS:'#DDF1EC',orange:'#F08A2C',orangeS:'#FDE6CC',
  red:'#C2410C',yellow:'#F6CF2E',green:'#1F5A2E',wood:'#C98B55',wood2:'#A86C3D',white:'#FFFFFF',line:'#E6D8C4',dark:'#2A3236',zalo:'#0068FF'};

/* ---------- hàm vẽ (trả về chuỗi SVG) ---------- */
const G=(x,y,inner,fx='',sc=1,rot=0)=>`<g transform="translate(${x} ${y})${sc!==1?` scale(${sc})`:''}${rot?` rotate(${rot})`:''}"><g data-fx="${fx}">${inner}</g></g>`;
const TX=(x,y,s,size=32,fill=C.ink,o={})=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.fx?` data-fx="${o.fx}"`:''}>${s}</text>`;
const RR=(x,y,w,h,r,fill,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}"${o.st?` stroke="${o.st}" stroke-width="${o.sw||3}"`:''}${o.fx?` data-fx="${o.fx}"`:''}/>`;
const CARD=(x,y,w,h,inner='',fx='',r=30)=>`<g data-fx="${fx}"><rect x="${x}" y="${y+10}" width="${w}" height="${h}" rx="${r}" fill="rgba(120,80,30,.08)"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" stroke="${C.line}" stroke-width="3"/>${inner}</g>`;
const PILL=(x,y,w,h,label,col,fx='',size=30,tc='#fff')=>`<g data-fx="${fx}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${col}"/>${TX(x+w/2,y+h/2+size*.36,label,size,tc,{w:800})}</g>`;
const CHECK=(r=26,bg=C.teal)=>`<circle r="${r}" fill="${bg}"/><path d="M${-r*.42} 0 L${-r*.1} ${r*.32} L${r*.45} ${-r*.34}" fill="none" stroke="#fff" stroke-width="${r*.2}" stroke-linecap="round" stroke-linejoin="round"/>`;
const LOCK=(s=1,col=C.muted)=>`<g transform="scale(${s})"><path d="M-11 -4 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="${col}" stroke-width="5"/><rect x="-17" y="-5" width="34" height="27" rx="6" fill="${col}"/></g>`;
const TAP=(fx)=>`<g data-fx="${fx}"><circle r="34" fill="none" stroke="${C.orange}" stroke-width="6"/></g>`;

/* cuốn sách NỀN TẢNG TIẾNG ANH (vẽ lại, đơn giản) */
function BOOK(w=220,h=300){
  return `<g><rect x="${-w/2+10}" y="${-h/2+12}" width="${w}" height="${h}" rx="10" fill="rgba(0,0,0,.12)"/>
   <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="10" fill="${C.yellow}"/>
   <rect x="${-w/2}" y="${-h/2+h*.62}" width="${w}" height="${h*.38}" rx="10" fill="${C.green}"/>
   <rect x="${-w/2}" y="${-h/2+h*.62}" width="${w}" height="10" fill="${C.green}"/>
   <rect x="${-w/2}" y="${-h/2+h*.6}" width="${w}" height="8" fill="${C.orange}"/>
   <rect x="${-w/2}" y="${-h/2+h*.06}" width="${w}" height="${h*.08}" fill="rgba(255,255,255,.45)"/>
   ${TX(0,-h/2+h*.115,'ANDREW CLASSES',w*.065,'#1b2a5a',{w:800})}
   ${TX(0,-h/2+h*.28,'NỀN TẢNG',w*.15,C.red,{w:900})}
   ${TX(0,-h/2+h*.42,'TIẾNG ANH',w*.15,C.red,{w:900})}
   ${RR(-w*.33,-h/2+h*.47,w*.66,h*.075,h*.04,C.green)}${TX(0,-h/2+h*.525,'First Steps English',w*.06,'#fff',{w:700})}
   ${TX(0,-h/2+h*.78,'Dành cho học sinh',w*.072,C.yellow,{w:800})}${TX(0,-h/2+h*.86,'mới bắt đầu',w*.072,C.yellow,{w:800})}</g>`;
}
/* sách mở (học sinh cầm đọc) */
function OPENBOOK(w=360,h=230){
  const l=Array.from({length:6},(_,i)=>`<line x1="${-w/2+30}" y1="${-h/2+50+i*28}" x2="${-24}" y2="${-h/2+50+i*28}" stroke="#d9cbb3" stroke-width="7" stroke-linecap="round"/><line x1="24" y1="${-h/2+50+i*28}" x2="${w/2-30}" y2="${-h/2+50+i*28}" stroke="#d9cbb3" stroke-width="7" stroke-linecap="round"/>`).join('');
  return `<g><path d="M0 ${-h/2+12} Q${-w/4} ${-h/2-14} ${-w/2} ${-h/2+4} L${-w/2} ${h/2} Q${-w/4} ${h/2-22} 0 ${h/2} Q${w/4} ${h/2-22} ${w/2} ${h/2} L${w/2} ${-h/2+4} Q${w/4} ${-h/2-14} 0 ${-h/2+12}Z" fill="${C.yellow}" stroke="#c9a51d" stroke-width="4"/>
   <path d="M0 ${-h/2+20} Q${-w/4} ${-h/2-4} ${-w/2+14} ${-h/2+12} L${-w/2+14} ${h/2-12} Q${-w/4} ${h/2-30} 0 ${h/2-10} Q${w/4} ${h/2-30} ${w/2-14} ${h/2-12} L${w/2-14} ${-h/2+12} Q${w/4} ${-h/2-4} 0 ${-h/2+20}Z" fill="#fffaf0"/>
   ${l}<line x1="0" y1="${-h/2+20}" x2="0" y2="${h/2-10}" stroke="#d9cbb3" stroke-width="3"/></g>`;
}
/* máy tính bảng / điện thoại: inner vẽ trong hệ toạ độ màn hình (0,0 = góc trên trái) */
function DEVICE(w,h,inner,o={}){
  const b=o.b||22;
  return `<g><rect x="${-w/2+8}" y="${-h/2+12}" width="${w}" height="${h}" rx="${b+12}" fill="rgba(0,0,0,.15)"/>
   <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${b+12}" fill="${C.dark}"/>
   <g transform="translate(${-w/2+b} ${-h/2+b})"><rect width="${w-2*b}" height="${h-2*b}" rx="12" fill="#fff"/>${inner}</g></g>`;
}
/* thanh trình duyệt andrewclasses.com */
const URLBAR=(w)=>`${RR(0,0,w,56,12,'#F1F4F3')}${RR(16,12,w-32,32,16,'#fff',{st:'#dde4e2',sw:2})}${TX(40,35,'🔒 andrewclasses.com',20,C.muted,{a:'start',w:600})}`;

/* người (nửa trên, nhìn thẳng). o: {skin,hair,shirt,adult,mouth:'smile'|'open', hl:[x,y] tay trái, hr:[x,y] tay phải, hairStyle} */
function PERSON(o){
  const skin=o.skin||'#F5C9A0',hair=o.hair||'#4A2C1D',shirt=o.shirt||C.orange,sk2='#e3ad80';
  const hl=o.hl||[-120,120],hr=o.hr||[120,120];
  const arm=(sx,sy,[hx,hy],side)=>{const ex=(sx+hx)/2+side*40,ey=(sy+hy)/2+30;
    return `<path d="M${sx} ${sy} Q${ex} ${ey} ${hx} ${hy}" fill="none" stroke="${shirt}" stroke-width="46" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="25" fill="${skin}"/>`};
  const hairP=o.adult
    ?`<path d="M-80 -222 Q-86 -306 0 -306 Q86 -306 80 -222 Q74 -262 40 -268 Q0 -250 -44 -268 Q-74 -262 -80 -222Z" fill="${hair}"/>`
    :`<path d="M-84 -210 Q-96 -310 -10 -312 Q70 -318 88 -250 Q96 -224 84 -206 Q78 -246 54 -258 Q30 -236 2 -262 Q-22 -238 -50 -258 Q-74 -246 -84 -210Z" fill="${hair}"/><path d="M-30 -308 q18 -26 40 -8" fill="none" stroke="${hair}" stroke-width="14" stroke-linecap="round"/>`;
  const mouth=o.mouth==='open'
    ?`<path d="M-24 -182 Q0 -150 24 -182 Z" fill="#7a2a1c"/><path d="M-14 -166 Q0 -158 14 -166" fill="none" stroke="#e86a5a" stroke-width="6" stroke-linecap="round"/>`
    :`<path d="M-26 -184 Q0 -160 26 -184" fill="none" stroke="#7a2a1c" stroke-width="7" stroke-linecap="round"/>`;
  return `<g>
   <path d="M-110 150 L-104 -40 Q-100 -118 -40 -126 L40 -126 Q100 -118 104 -40 L110 150 Z" fill="${shirt}"/>
   <path d="M-30 -126 Q0 -100 30 -126" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="6"/>
   <rect x="-22" y="-150" width="44" height="34" fill="${sk2}"/>
   <circle cx="-80" cy="-212" r="16" fill="${skin}"/><circle cx="80" cy="-212" r="16" fill="${skin}"/>
   <ellipse cx="0" cy="-214" rx="80" ry="84" fill="${skin}"/>
   ${hairP}
   <circle cx="-28" cy="-218" r="9" fill="#2a1a12"/><circle cx="28" cy="-218" r="9" fill="#2a1a12"/>
   <path d="M-44 -246 q14 -8 28 0 M16 -246 q14 -8 28 0" fill="none" stroke="${hair}" stroke-width="6" stroke-linecap="round"/>
   <circle cx="-50" cy="-190" r="11" fill="rgba(240,120,100,.25)"/><circle cx="50" cy="-190" r="11" fill="rgba(240,120,100,.25)"/>
   ${mouth}
   ${o.noArms?'':arm(-84,-90,hl,-1)+arm(84,-90,hr,1)}
  </g>`;
}
const CHILD=(o={})=>PERSON(Object.assign({skin:'#F7CDA6',hair:'#4A2C1D',shirt:C.orange},o));
const KID2=(o={})=>PERSON(Object.assign({skin:'#F7CDA6',hair:'#4A2C1D',shirt:'#F2B92E'},o));
const PARENT=(o={})=>PERSON(Object.assign({skin:'#EDBB8F',hair:'#2B1D16',shirt:'#3E8E7E',adult:true},o));
const TABLE=(y=800)=>`<rect x="-40" y="${y}" width="2000" height="40" rx="12" fill="${C.wood}"/><rect x="-40" y="${y+30}" width="2000" height="400" fill="${C.wood2}"/>`;
/* bóng thoại */
function BUBBLE(x,y,w,h,text,o={}){
  const tail=o.tail||'bl',col=o.col||'#fff',tc=o.tc||C.ink;
  const tp={bl:`M${x+50} ${y+h-2} L${x+30} ${y+h+40} L${x+100} ${y+h-2}Z`,br:`M${x+w-100} ${y+h-2} L${x+w-30} ${y+h+40} L${x+w-50} ${y+h-2}Z`}[tail];
  return `<g data-fx="${o.fx||''}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="30" fill="${col}" stroke="${C.line}" stroke-width="3"/><path d="${tp}" fill="${col}"/>${TX(x+w/2,y+h/2+(o.size||30)*.36,text,o.size||30,tc,{w:700})}</g>`;
}
/* bảng 4 lựa chọn (màn hình hoạt động) — w x h là kích thước màn hình */
function QUIZ(w,h,o={}){
  /* luôn vẽ ở khung chuẩn 776×516 rồi thu/phóng — màn hình nhỏ không bị kích thước âm */
  return `<g transform="scale(${f1(w/776*1000)/1000} ${f1(h/516*1000)/1000})">${QUIZ0(776,516,o)}</g>`;
}
function QUIZ0(w,h,o={}){
  const top=o.url?66:14, q=`${RR(18,top,w-36,92,16,C.tealS)}${RR(40,top+30,w*.55,14,7,'#9fcfc5')}${RR(40,top+56,w*.38,14,7,'#9fcfc5')}`;
  const ow=(w-54)/2,oh=(h-top-130)/2-12;

  s.anims=[];
});

const player=$('#player'),stage=$('#stage'),scenesEl=$('#scenes'),head=$('#head'),capEl=$('#cap');
function parseWhen(w,s){
  let m=/^c(\d+)(?:\+(-?[\d.]+))?$/.exec(w);if(m)return s.cs[+m[1]]+(+m[2]||0);
  m=/^e-([\d.]+)$/.exec(w);if(m)return s.dur-(+m[1]);
  return parseFloat(w);
}
SC.forEach((s,i)=>{
  const sec=document.createElement('section');sec.className='scene';
  sec.innerHTML=`<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${s.svg(s)}</svg>`;
  scenesEl.appendChild(sec);s.el=sec;
  sec.querySelectorAll('[data-fx]').forEach(el=>{
    const spec=el.dataset.fx.trim();if(!spec)return;
    spec.split(/\s+/).forEach(tok=>{
      const m=/^([A-Za-z0-9]+)@([^/\s]+)(?:\/([\d.]+))?$/.exec(tok);if(!m)return;
      let p=P[m[1]];if(!p){console.warn('thiếu hiệu ứng',m[1]);return}
      if(typeof p==='function')p=p(el);
      if(p.o)el.style.transformOrigin=p.o;
      const start=parseWhen(m[2],s),dur=m[3]?+m[3]:p.d;
      const a=el.animate(p.kf,{delay:start*1000,duration:dur*1000,fill:p.fill||'both',easing:p.e||'ease',iterations:p.loop?Infinity:1});
      a.pause();
      s.anims.push({a,delay:start*1000,end:p.loop?Infinity:(start+dur)*1000,last:null});
    });
  });
});

let T0=0,_lastSec=-1,t=0,playing=false,speed=1,cur=-1,lastKey=-1,lastWordIdx=-1,ccOn=true,ended=false,lastNow=0,idleTimer=0;
const ICO_PLAY='<svg viewBox="0 0 24 24"><path class="f" d="M7 4.2v15.6a1 1 0 0 0 1.5.9l13-7.8a1 1 0 0 0 0-1.7l-13-7.8A1 1 0 0 0 7 4.2z"/></svg>';
const ICO_PAUSE='<svg viewBox="0 0 24 24"><rect class="f" x="6" y="4" width="4.5" height="16" rx="1.2"/><rect class="f" x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
const bPlay=$('#bPlay');bPlay.innerHTML=ICO_PLAY;
const bar=$('#bar'),tip=$('#tip');
SC.forEach(s=>{const d=document.createElement('div');d.className='seg';d.style.flexGrow=s.dur;d.innerHTML='<i></i>';bar.appendChild(d);s.seg=d;s.fill=d.firstChild});
const fmt=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const chapName=s=>s.title;

function setScene(i){
  if(cur>=0)SC[cur].el.style.opacity=0;
  cur=i;const s=SC[i];
  s.anims.forEach(o=>o.last=null);
  head.style.display=s.kicker?'block':'none';
  if(s.kicker){head.firstChild.textContent=s.kicker;head.lastChild.textContent=s.title;head.classList.remove('in');void head.offsetWidth;head.classList.add('in')}
  $('#chap').textContent=(i?String(i).padStart(2,'0')+' · ':'')+chapName(s);
  MD.emit('chapter',{chuong:i,ten:chapName(s),tong_chuong:SC.length});
}
function buildCap(ci,s){
  const c=s.cues[ci],parts=c.text.split('**');let html='';
  parts.forEach((p,k)=>{p.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w))html+=w;else html+=`<span class="w${k%2?' k':''}">${w}</span>`})});
  capEl.innerHTML=html;capEl._w=[...capEl.querySelectorAll('.w')];lastWordIdx=-1;
}
function render(){
  const tt=clamp(t,0,TOTAL-.001);
  let si=SC.length-1;for(let i=0;i<SC.length;i++){if(tt<SC[i].start+SC[i].dur){si=i;break}}
  if(si!==cur)setScene(si);
  const s=SC[si],lt=tt-s.start,ms=lt*1000;
  for(const o of s.anims){
    if(o.last!==null&&((ms<=o.delay&&o.last<=o.delay)||(ms>=o.end&&o.last>=o.end)))continue;
    o.a.currentTime=ms;o.last=ms;
  }
  s.el.style.opacity=clamp(Math.min(lt/.45,(s.dur-lt)/.5),0,1);
  if(si===0&&lt<.45)s.el.style.opacity=1;
  let ci=0;for(let k=0;k<s.cs.length;k++)if(lt>=s.cs[k])ci=k;
  const key=si*100+ci,c=s.cues[ci],off=lt-s.cs[ci];
  if(key!==lastKey){lastKey=key;buildCap(ci,s)}
  const prog=off/Math.max(.1,c.dur-PAD*.6);const n=Math.floor(clamp(prog,0,1)*capEl._w.length+.999);
  if(n!==lastWordIdx){lastWordIdx=n;capEl._w.forEach((w,k)=>w.classList.toggle('on',k<n))}
  capEl.parentNode.style.opacity=(lt>s.cueEnd+.9&&si>0&&si<SC.length-1)?0:1;
  SC.forEach(x=>{x.fill.style.width=(tt>=x.start+x.dur?100:tt<=x.start?0:(tt-x.start)/x.dur*100)+'%'});
  $('#time').textContent=fmt(tt)+' / '+fmt(TOTAL);
}
function frame(now){
  if(player.clientWidth!==_fw)fit();
  const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;
  if(playing){
    t+=dt*speed;
    if(t>=TOTAL-.05){t=TOTAL-.05;pause(true);ended=true;$('#endcard').classList.remove('hide');MD.emit('progress',{t:f1(TOTAL),tong:f1(TOTAL),pct:100});MD.emit('ended')}
  }
  render();
  if(playing){const sec=Math.floor(t);if(sec!==_lastSec){_lastSec=sec;MD.emit('progress',{t:f1(t),tong:f1(TOTAL),pct:Math.round(t/TOTAL*100)})}}
  requestAnimationFrame(frame);
}
function play(){
  if(ended){t=0;ended=false;lastKey=-1}
  $('#poster').classList.add('hide');$('#endcard').classList.add('hide');
  playing=true;stage.classList.remove('paused');player.classList.add('playing');bPlay.innerHTML=ICO_PAUSE;
  poke();MD.emit('play',{t:f1(t)});
}
function pause(silent){
  const was=playing;
  playing=false;stage.classList.add('paused');player.classList.remove('playing');bPlay.innerHTML=ICO_PLAY;
  if(was)MD.emit('pause',{t:f1(t)});
}
function seek(x){t=clamp(x,0,TOTAL-.06);ended=false;$('#endcard').classList.add('hide');lastKey=-1;render();MD.emit('seek',{t:f1(t)})}
function togglePlay(){playing?pause():play()}
function skipScene(d){const i=clamp((cur<0?0:cur)+d,0,SC.length-1);seek(SC[i].start+.02)}
function poke(){player.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>player.classList.add('idle'),2600)}

bPlay.onclick=togglePlay;
$('#bBack').onclick=()=>seek(t-5);
$('#poster').onclick=()=>{t=T0;lastKey=-1;play()};
$('#endcard').onclick=()=>{t=0;ended=false;lastKey=-1;play()};
stage.onclick=togglePlay;
$('#bCC').onclick=()=>{ccOn=!ccOn;stage.classList.toggle('nocc',!ccOn);$('#bCC').classList.toggle('off',!ccOn)};
const SPEEDS=[.75,1,1.25,1.5];
$('#spd').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('#spd').textContent=speed+'×'};
$('#bFull').onclick=()=>{const w=$('#wrap');if(document.fullscreenElement)document.exitFullscreen();else (w.requestFullscreen||w.webkitRequestFullscreen).call(w)};
let drag=false;
const barT=e=>{const r=bar.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*TOTAL};
const segAt=x=>{for(let i=0;i<SC.length;i++)if(x<SC[i].start+SC[i].dur)return SC[i];return SC[SC.length-1]};
bar.addEventListener('pointerdown',e=>{drag=true;bar.classList.add('drag');bar.setPointerCapture(e.pointerId);$('#poster').classList.add('hide');seek(barT(e))});
bar.addEventListener('pointermove',e=>{
  const x=barT(e);if(drag)seek(x);
  const pr=player.getBoundingClientRect();tip.style.display='block';tip.style.left=clamp(e.clientX-pr.left,60,pr.width-60)+'px';
  tip.textContent=fmt(x)+'  ·  '+chapName(segAt(x));
});
bar.addEventListener('pointerup',()=>{drag=false;bar.classList.remove('drag')});
bar.addEventListener('pointerleave',()=>{tip.style.display='none'});
player.addEventListener('mousemove',poke);player.addEventListener('touchstart',poke,{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.code==='Space')e.preventDefault();
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k==='k'){e.preventDefault();if(!$('#poster').classList.contains('hide')){t=T0;lastKey=-1}togglePlay()}
  else if(e.key==='ArrowRight')seek(t+5);else if(e.key==='ArrowLeft')seek(t-5);
  else if(k==='f')$('#bFull').click();else if(k==='c')$('#bCC').click();
  else if(e.key==='.'||e.key===']')skipScene(1);else if(e.key===','||e.key==='[')skipScene(-1);
  poke();
});
let _fw=0;function fit(){_fw=player.clientWidth;stage.style.transform=`scale(${_fw/1920})`}
window.addEventListener('resize',fit);fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(player);

window.__video={seek,SC,get total(){return TOTAL},get t(){return t},get playing(){return playing},play,pause};
poke();
t=2.6;render();requestAnimationFrame(n=>{lastNow=n;frame(n)});

/* tuỳ chọn trên link + nhắn tin với trang mẹ: ?t=60 · ?cc=0 · ?toc=1.25 */
(()=>{
  const q=MD.q;
  if(q.get('cc')==='0')$('#bCC').click();
  const sp=parseFloat(q.get('toc'));if(SPEEDS.includes(sp)){speed=sp;$('#spd').textContent=sp+'×'}
  const st=parseFloat(q.get('t'));if(st>0)T0=clamp(st,0,TOTAL-.5);
  MD.onLenh((lenh,m)=>{
    if(lenh==='play'){if(!$('#poster').classList.contains('hide')){t=T0;lastKey=-1}play()}
    else if(lenh==='pause')pause();
    else if(lenh==='seek'&&isFinite(m.t))seek(+m.t);
    else if(lenh==='chuong'&&SC[m.i|0])seek(SC[m.i|0].start+.02);
  });
  MD.emit('ready',{tong:f1(TOTAL),tong_chuong:SC.length});
})();
</script>
</body>
</html>
