<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="mydocument:id" content="video/doc-hieu/dw-s2-w2-mole-rat">
<title>DW-S2.W2 · Mole Rat</title>
<!-- Trình phát CHUNG của thẻ Phim vẽ (myStudio v0.6.0) — dùng cho mọi phong cách:
     khung ẩn nạp trang phim (window.DUR / READY / render(t), cùng nguồn) ⇒ đồng hồ chính = tệp âm thanh đã trộn,
     mỗi khung gọi render(t). Ở app: phim = index.html, am = mix.wav. Trên myDocument: phim = phim.html, am = am-thanh.mp3.
     Tuỳ chọn link: ?t=N  ?cc=0. Nhận lệnh trang mẹ {lenh:'play'|'pause'|'seek', t}; báo ready/play/pause/progress/ended. -->
<style>
  :root{--bg:#15171c;--ink:#f4f2ec;--accent:#d97757;--bar:rgba(20,22,28,.78)}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #khung{position:relative;width:100%;height:100%;overflow:hidden}
  #san{position:absolute;left:50%;top:50%;transform-origin:0 0;cursor:pointer}
  #san iframe{display:block;border:0;pointer-events:none;background:#f4f3ef}
  #nut-lon{position:absolute;inset:0;margin:auto;width:110px;height:110px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);box-shadow:0 10px 40px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .2s cubic-bezier(.22,.9,.3,1)}
  #nut-lon:hover{transform:scale(1.06)}
  #nut-lon svg{width:44px;height:44px;margin-left:8px;fill:#fff}
  .an{display:none!important}
  #thanh{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);opacity:0;transition:opacity .25s}
  #khung:hover #thanh,#khung.dung #thanh{opacity:1}
  #thanh button{background:none;border:0;color:var(--ink);cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:8px}
  #thanh button:hover{background:rgba(255,255,255,.12)}
  #thanh svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #tua{flex:1;accent-color:var(--accent);cursor:pointer}
  #gio{font-variant-numeric:tabular-nums;font-size:14px;min-width:88px;text-align:center}
  #cc.tat{opacity:.45}
  #dang-tai{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:#bbb}
</style>
<script src="/_chung/chan-phim.js?v=1"></script>
</head>
<body>
<div id="khung" class="dung">
  <div id="san"><iframe id="phim" title="film"></iframe></div>
  <div id="dang-tai">Loading…</div>
  <button id="nut-lon" class="an" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
  <div id="thanh">
    <button id="choi" aria-label="Play/Pause"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></button>
    <input id="tua" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span id="gio">0:00 / 0:00</span>
    <button id="cc" aria-label="Subtitles"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg></button>
    <button id="to" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
</div>
<audio id="am" preload="auto"></audio>
<script src="../../../_chung/nhung.js"></script>
<script>
(function () {
  var CFG = { phim: 'phim.html', am: 'am-thanh.mp3', w: 1920, h: 1080 };
  var MD = window.MyDocument || { nhung: false, q: new URLSearchParams(location.search), emit: function () {}, onLenh: function () {} };
  var Q = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var am = $('am'), fr = $('phim'), san = $('san'), khung = $('khung');
  var W = +Q.get('w') || CFG.w, H = +Q.get('h') || CFG.h;
  var PLAY = '<polygon points="6 4 20 12 6 20 6 4"/>', PAUSE = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  var P = null, DUR = 0, daChoi = false, tCuoi = -1, baoLuc = -1, cc = Q.get('cc') !== '0';
  // v0.12.3 (thầy chốt 28/10/2026) — KHOÁ TUA: trang mẹ (trang bài học sinh myLesson) gửi {lenh:'khoaTua', t: giây xem liền xa nhất}
  // ⇒ không tua/kéo quá mốc đó (kéo lên thì chấm đang phát nhảy về mốc); t = null ⇒ mở khoá (em đã xem hết). Mở riêng = không khoá.
  var TUA_MAX = Infinity;
  fr.width = W; fr.height = H;
  function vua() { var k = Math.min(khung.clientWidth / W, khung.clientHeight / H); san.style.transform = 'scale(' + k + ') translate(-50%,-50%)'; }
  addEventListener('resize', vua); vua();
  var fmt = function (s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function ve(t) {
    if (!P || t === tCuoi) return; tCuoi = t;
    try { P.render(t); } catch (e) { console.error(e); }
    $('tua').value = Math.round(t / DUR * 1000); $('gio').textContent = fmt(t) + ' / ' + fmt(DUR);
  }
  function datPhuDe() { if (P && P.setSubs) { try { P.setSubs(cc); } catch (_) {} } $('cc').classList.toggle('tat', !cc); tCuoi = -1; }
  fr.src = (Q.get('phim') || CFG.phim) + (/\?/.test(Q.get('phim') || CFG.phim) ? '&' : '?') + 'nhung=1';
  am.src = Q.get('am') || CFG.am;
  // chờ trang phim sẵn sàng (window.READY) — mốc tuyệt đối 180 s, không treo vào rAF
  var batDau = Date.now();
  (function cho() {
    var w = null; try { w = fr.contentWindow; } catch (_) {}
    if (w && w.READY && typeof w.render === 'function') {
      P = w; DUR = +w.DUR || am.duration || 0;
      datPhuDe();
      var tBia = DUR - 0.1; if (P.setSubs) P.setSubs(false); try { P.render(tBia); } catch (_) {} if (P.setSubs) P.setSubs(cc);
      $('gio').textContent = '0:00 / ' + fmt(DUR);
      $('dang-tai').classList.add('an'); $('nut-lon').classList.remove('an');
      var t0 = Math.min(DUR - 1, Math.max(0, +Q.get('t') || 0)); if (t0) am.currentTime = t0;
      MD.emit('ready', { tong: DUR });
      return;
    }
    if (Date.now() - batDau > 180000) { $('dang-tai').textContent = 'Could not load the film.'; return; }
    setTimeout(cho, 150);
  })();
  function choi() { if (!P) return; daChoi = true; tCuoi = -1; if (am.ended || am.currentTime >= DUR - 0.05) am.currentTime = 0; am.play(); }
  function dung() { am.pause(); }
  function doi() { am.paused ? choi() : dung(); }
  am.addEventListener('play', function () { $('nut-lon').classList.add('an'); khung.classList.remove('dung'); $('choi').querySelector('svg').innerHTML = PAUSE; MD.emit('play', { t: am.currentTime }); });
  am.addEventListener('pause', function () { khung.classList.add('dung'); $('choi').querySelector('svg').innerHTML = PLAY; if (!am.ended) MD.emit('pause', { t: am.currentTime }); });
  am.addEventListener('ended', function () { $('nut-lon').classList.remove('an'); MD.emit('ended'); });
  // vẽ: rAF khi đang xem (chỉ là hình — việc bắt buộc không treo vào đây)
  (function vong() {
    if (daChoi && P) {
      var t = Math.min(DUR, am.currentTime); ve(t);
      var s = Math.floor(t);
      if (!am.paused && s !== baoLuc) { baoLuc = s; MD.emit('progress', { t: +t.toFixed(1), tong: DUR, pct: Math.round(t / DUR * 100) }); }
    }
    requestAnimationFrame(vong);
  })();
  function tuaToi(t) { if (!P) return; daChoi = true; t = Math.max(0, Math.min(DUR, TUA_MAX, +t)); am.currentTime = t; tCuoi = -1; ve(t); }
  am.addEventListener('seeking', function () { if (am.currentTime > TUA_MAX + 0.3) am.currentTime = TUA_MAX; });   // mọi đường tua khác
  $('nut-lon').onclick = choi; san.onclick = doi; $('choi').onclick = doi;
  $('tua').oninput = function (e) { tuaToi(e.target.value / 1000 * DUR); };
  $('cc').onclick = function () { cc = !cc; datPhuDe(); };
  $('to').onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else if (khung.requestFullscreen) khung.requestFullscreen(); };
  addEventListener('keydown', function (e) { if (e.code === 'Space') { e.preventDefault(); doi(); } });
  // lệnh từ trang mẹ: myDocument (nhung.js) hoặc app myStudio (postMessage thẳng)
  MD.onLenh(function (lenh, m) { if (lenh === 'play') choi(); else if (lenh === 'pause') dung(); else if (lenh === 'seek' && m.t != null) tuaToi(m.t);
    else if (lenh === 'khoaTua') TUA_MAX = (m.t == null || !isFinite(+m.t)) ? Infinity : Math.max(0, +m.t); });
  // v0.12.0 NGHE THỬ BẢNG CHỈNH TIẾNG (chỉ trong app myStudio): trang mẹ gửi {lenh:'tron', cai} ⇒ tắt tiếng mix.wav, phát 3 tiếng
  // riêng tron/*.flac qua WebAudio; đồng hồ vẫn là <audio> (đã tắt tiếng). Công thức nhạc GIỐNG HỆT tron-lai.py (nhac_xu_ly).
  var TR = null, napDo = null;
  function db(x) { return Math.pow(10, x / 20); }
  function baoMe(o) { try { parent.postMessage(Object.assign({ su: 'tron' }, o), '*'); } catch (_) {} }
  function napTron() {
    if (napDo) return napDo;
    napDo = (async function () {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var j = await (await fetch('tron/tron.json', { cache: 'no-store' })).json();
      var lay = function (ten) { return fetch('tron/' + ten + '.flac', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('thiếu ' + ten); return r.arrayBuffer(); }).then(function (b) { return ctx.decodeAudioData(b); }); };
      var b = await Promise.all([lay('giong'), lay('nhac'), lay('tieng')]);
      var g = {}; ['giong', 'nhac', 'tieng'].forEach(function (k) { g[k] = ctx.createGain(); g[k].connect(ctx.destination); });
      TR = { ctx: ctx, j: j, buf: { giong: b[0], nhac: b[1], tieng: b[2] }, nhacXl: null, khoaNhac: '', g: g, nguon: [], cai: null, t0: 0 };
    })();
    napDo.catch(function () { napDo = null; });
    return napDo;
  }
  function tronNhac(cai) {   // nhạc × (1 − (1 − db(−duck)) × env) × vào × ra — env nội suy tuyến tính như np.interp
    var key = [cai.duck, cai.vao, cai.ra].join('|'); if (TR.nhacXl && TR.khoaNhac === key) return;
    var src = TR.buf.nhac, sr = src.sampleRate, n = src.length, env = TR.j.env || [], hz = +TR.j.hz || 20, L = env.length;
    var dd = 1 - db(-cai.duck), dur = n / sr, gain = new Float32Array(n), i, c;
    for (i = 0; i < n; i++) {
      var t = i / sr, x = t * hz, k = Math.floor(x), e = !L ? 0 : k >= L - 1 ? env[L - 1] : env[k] + (env[k + 1] - env[k]) * (x - k);
      var v = 1 - dd * e;
      if (cai.vao > 0) v *= Math.min(1, t / cai.vao);
      if (cai.ra > 0) v *= Math.max(0, Math.min(1, (dur - t) / cai.ra));
      gain[i] = v;
    }
    var out = TR.ctx.createBuffer(src.numberOfChannels, n, sr);
    for (c = 0; c < src.numberOfChannels; c++) { var a = src.getChannelData(c), o = out.getChannelData(c); for (i = 0; i < n; i++) o[i] = a[i] * gain[i]; }
    TR.nhacXl = out; TR.khoaNhac = key;
  }
  function datMuc() {
    var c = TR.cai, m = TR.j.muc || {};
    TR.g.giong.gain.value = (+m.giong || 1) * db(c.giong); TR.g.nhac.gain.value = (+m.nhac || 1) * db(c.nhac);
    TR.g.tieng.gain.value = c.tiengDong ? (+m.tieng || 1) * db(c.tieng) : 0;
  }
  function tatNguon() { if (!TR) return; TR.nguon.forEach(function (x) { try { x.stop(); } catch (_) {} }); TR.nguon = []; }
  function batNguon() {
    if (!TR || !TR.cai || am.paused) return;
    tatNguon(); if (TR.ctx.state === 'suspended') TR.ctx.resume();
    var t = am.currentTime; TR.t0 = TR.ctx.currentTime - t;
    [['giong', TR.buf.giong], ['nhac', TR.nhacXl], ['tieng', TR.buf.tieng]].forEach(function (x) {
      if (t >= x[1].duration) return;
      var s = TR.ctx.createBufferSource(); s.buffer = x[1]; s.connect(TR.g[x[0]]); s.start(0, t); TR.nguon.push(s);
    });
  }
  async function batTron(cai) {
    try {
      if (!TR) { baoMe({ tt: 'dang-tai' }); await napTron(); }
      var doi = !TR.cai || [TR.cai.duck, TR.cai.vao, TR.cai.ra].join('|') !== [cai.duck, cai.vao, cai.ra].join('|');
      TR.cai = cai; tronNhac(cai); datMuc(); am.muted = true;
      if (doi || !TR.nguon.length) batNguon();
      baoMe({ tt: 'san' });
    } catch (e) { tatTron(); baoMe({ tt: 'loi', chu: String((e && e.message) || e) }); }
  }
  function tatTron() { tatNguon(); if (TR) TR.cai = null; am.muted = false; }
  am.addEventListener('play', batNguon);
  am.addEventListener('pause', tatNguon);
  am.addEventListener('seeked', function () { if (TR && TR.cai && !am.paused) batNguon(); });
  setInterval(function () {   // giữ 3 tiếng khớp đồng hồ (lệch > 0,12 s ⇒ phát lại từ đúng chỗ)
    if (TR && TR.cai && !am.paused && TR.nguon.length && Math.abs((TR.ctx.currentTime - TR.t0) - am.currentTime) > 0.12) batNguon();
  }, 1000);
  if (!window.MyDocument) addEventListener('message', function (e) {
    var m = e.data || {}; if (m.lenh === 'play') choi(); else if (m.lenh === 'pause') dung(); else if (m.lenh === 'seek' && m.t != null) tuaToi(m.t);
    else if (m.lenh === 'tron' && m.cai) batTron(m.cai); else if (m.lenh === 'tron-tat') tatTron();
  });
  window.__xem = { tuaToi: tuaToi, choi: choi, dung: dung, batTron: batTron, tatTron: tatTron,
    tron: function () { return TR && { nguon: TR.nguon.length, cai: TR.cai, ctx: TR.ctx.state, lech: TR.cai ? +((TR.ctx.currentTime - TR.t0) - am.currentTime).toFixed(3) : null }; } };
})();
</script>
</body>
</html>
