*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03060f;color:var(--ink);font-family:'Montserrat','Segoe UI',system-ui,sans-serif;overflow:hidden}

/* ---------- background ---------- */
#bg{position:absolute;inset:0;background:
  radial-gradient(1200px 800px at 12% 8%,#17336a 0%,transparent 60%),
  radial-gradient(1100px 900px at 92% 96%,#0d3c4d 0%,transparent 60%),
  linear-gradient(160deg,#0a1331,#070b1c 60%,#0a1428)}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.30;background:var(--accent);animation:drift 24s ease-in-out infinite alternate;transition:background 1s}
.orb.o1{width:700px;height:700px;left:-160px;top:-180px}
.orb.o2{width:620px;height:620px;right:-120px;bottom:-200px;background:#6a5cff;animation-duration:30s}
.orb.o3{width:420px;height:420px;left:900px;top:300px;opacity:.14;animation-duration:36s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,-90px) scale(1.25)}}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(150,190,255,.13) 1.6px,transparent 1.8px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 78%)}
.spark{position:absolute;border-radius:50%;background:rgba(190,225,255,.55);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-1200px);opacity:0}}
#stage.paused .orb,#stage.paused .spark{animation-play-state:paused}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(2,5,15,.55) 100%);pointer-events:none}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.scene svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg [data-fx]{transform-box:fill-box;transform-origin:center}
svg text{font-family:'Montserrat','Segoe UI',system-ui,sans-serif}
.card{fill:rgba(255,255,255,.065);stroke:rgba(255,255,255,.17);stroke-width:2}
.hl{fill:none;stroke:var(--accent);stroke-width:5}

#head{position:absolute;left:100px;top:58px;pointer-events:none}
#head .k{font-size:22px;letter-spacing:.3em;font-weight:700;color:var(--accent)}

#head.in .t{animation:hin .8s .12s cubic-bezier(.2,.8,.2,1) both}

#brand b{color:var(--accent)}

/* ---------- captions ---------- */
#capwrap{position:absolute;left:0;right:0;bottom:0;height:280px;background:linear-gradient(to top,rgba(4,8,22,.94),rgba(4,8,22,.6) 58%,transparent);display:flex;align-items:flex-end;justify-content:center;padding:0 140px 62px;pointer-events:none}
#cap{font-size:42px;line-height:1.28;font-weight:600;text-align:center;max-width:1640px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#cap .w{color:rgba(234,242,255,.38);transition:color .3s}
#cap .w.on{color:#fff}
#cap .w.k{color:rgba(255,200,87,.4)}
#cap .w.k.on{color:var(--gold)}
#stage.nocc #capwrap{display:none}

#ctrl{position:absolute;left:0;right:0;bottom:0;padding:38px 16px 10px;background:linear-gradient(transparent,rgba(3,6,15,.9));display:flex;flex-direction:column;gap:4px;transition:opacity .35s;z-index:6}
#player.idle.playing #ctrl{opacity:0;pointer-events:none}
#player.idle.playing{cursor:none}
#bar{display:flex;gap:3px;height:18px;align-items:center;cursor:pointer;position:relative;touch-action:none}
.seg{flex:1 1 0;height:5px;background:rgba(255,255,255,.2);border-radius:3px;position:relative;overflow:hidden;transition:height .12s}
#bar:hover .seg,#bar.drag .seg{height:9px}
.seg i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--accent)}
#row{display:flex;align-items:center;gap:4px}
button.ib{background:none;border:0;color:#eaf2ff;width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
button.ib:hover{background:rgba(255,255,255,.15)}

button.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:#cfe0ff;margin:0 8px 0 6px;white-space:nowrap}
#chap{font-size:14px;color:#9fb3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
#spd{font:700 13px 'Montserrat','Segoe UI',sans-serif;color:#eaf2ff;background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:7px 10px;cursor:pointer;margin-right:4px}

/* ---------- poster / end ---------- */
.ovl{position:absolute;inset:0;z-index:5;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 50%,rgba(5,9,24,.1),rgba(5,9,24,.75))}
.ovl.hide{display:none}
.ovl .box{display:grid;justify-items:center;gap:2.2cqw;margin-top:0}
.bigplay{width:min(11vw,19vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#35e0d1,#4aa8ff);box-shadow:0 0 0 0 rgba(53,224,209,.6),0 12px 50px rgba(53,224,209,.45);animation:ring 2.2s infinite;color:#04101f}
.bigplay svg{width:42%;height:42%}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(53,224,209,.55),0 12px 50px rgba(53,224,209,.45)}70%{box-shadow:0 0 0 min(3vw,5vh) rgba(53,224,209,0),0 12px 50px rgba(53,224,209,.45)}100%{box-shadow:0 0 0 0 rgba(53,224,209,0),0 12px 50px rgba(53,224,209,.45)}}
.ovl .lab{font-weight:800;font-size:min(1.9vw,3.4vh);letter-spacing:.04em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.ovl .sub{font-weight:600;font-size:min(1.2vw,2.1vh);color:#b6c8ea;text-align:center;line-height:1.5;max-width:70%}
#player{container-type:inline-size}
#poster{place-items:end end;padding:0 7% 9% 0}
#poster .box{margin-bottom:0;justify-items:center;text-align:center}
#poster .bigplay{width:min(7.5vw,13vh)}
#poster .sub{display:none}

/* ?nhung=1 — nằm trong khung iframe của trang khác */
html.nhung #brand{display:none}
html.nhung #player{box-shadow:none}

<script>
'use strict';
/* =====================================================================
   Why are bones hard and muscles soft?  —  animated science explainer
   Timeline engine: every animation is a paused Web-Animation whose
   currentTime is driven by one master clock => play, pause, seek, speed.
   ===================================================================== */
const MD=window.MyDocument||{nhung:false,q:new URLSearchParams(location.search),emit(){},onLenh(){}};
const $=(q,r=document)=>r.querySelector(q);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const seg=(t,a,b)=>sm((t-a)/(b-a));
const mk=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const f1=n=>Math.round(n*10)/10;
const PI2=Math.PI*2;

/* ---------- drawing helpers (return SVG strings) ---------- */
const G=(x,y,inner,fx='',sc=1,rot=0)=>`<g transform="translate(${x} ${y})${sc!==1?` scale(${sc})`:''}${rot?` rotate(${rot})`:''}"><g data-fx="${fx}">${inner}</g></g>`;
const TX=(x,y,s,size=32,fill='#eaf2ff',o={})=>`<text${o.id?` id="${o.id}"`:''} x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.fx?` data-fx="${o.fx}"`:''}>${s}</text>`;
const CARD=(x,y,w,h,inner='',fx='',r=34)=>`<g data-fx="${fx}"><rect class="card" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>${inner}</g>`;
const PILL=(x,y,w,h,label,col,fx='',size=30,tc='#06122a')=>`<g data-fx="${fx}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${col}"/>${TX(x+w/2,y+h/2+size*.36,label,size,tc,{w:800})}</g>`;
const LN=(x1,y1,x2,y2,col='rgba(255,255,255,.55)',w=3,fx='',dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}${fx?` data-fx="${fx}"`:''}/>`;
const DOT=(x,y,r,col,fx='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"${fx?` data-fx="${fx}"`:''}/>`;

function starPath(R,A,n=7,pw=2.4,rot=-90,steps=150){
  let d='';
  for(let i=0;i<=steps;i++){
    const th=i/steps*PI2, c=Math.max(0,Math.cos(n*th)), r=R+A*Math.pow(c,pw);
    const a=th+rot*Math.PI/180;
    d+=(i?'L':'M')+f1(r*Math.cos(a))+' '+f1(r*Math.sin(a));
  }
  return d+'Z';
}
function cellMuscle(w=250,h=50,nuc=true){
  const r=h/2;
  return `<rect x="${-w/2}" y="${-r}" width="${w}" height="${h}" rx="${r}" fill="url(#gMus)"/>
  <rect x="${-w/2}" y="${-r}" width="${w}" height="${h}" rx="${r}" fill="url(#pStri)"/>
  <rect x="${-w/2+r*.5}" y="${-r+5}" width="${w-r}" height="${h*.2}" rx="${h*.1}" fill="rgba(255,255,255,.3)"/>
  ${nuc?[-.3,.06,.33].map(k=>`<ellipse cx="${k*w}" cy="${r*.42}" rx="${h*.3}" ry="${h*.17}" fill="#4a2a8f" opacity=".92"/>`).join(''):''}`;
}
function boneCell(sc=1){
  return `<g transform="scale(${sc})"><path d="${starPath(40,40,7,2.4)}" fill="url(#gBone)" stroke="#c9ac6e" stroke-width="5" stroke-linejoin="round"/><circle r="20" fill="url(#gNuc)"/><circle cx="-5" cy="-5" r="5" fill="rgba(255,255,255,.55)"/></g>`;
}
function neuron(){
  const dend=[[-155,-62],[-146,46],[-112,-98],[-104,76],[-170,-8]];
  return `<g stroke="#c9bfff" stroke-width="7" stroke-linecap="round" fill="none">${dend.map(([x,y])=>`<path d="M-70 0 L${x} ${y}"/>`).join('')}<path d="M-70 0 H150"/><path d="M150 0 l26 -24 M150 0 l30 6 M150 0 l20 30"/></g>
  <circle cx="-70" cy="0" r="35" fill="#a99bff"/><circle cx="-70" cy="0" r="14" fill="#4b3bc2"/>${[[150,0],[176,-24],[180,6],[170,30]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="#e1daff"/>`).join('')}`;
}
function rbc(){return `<circle r="64" fill="url(#gRBC)"/><ellipse rx="30" ry="25" fill="#b92646" opacity=".7"/><ellipse cx="-12" cy="-30" rx="26" ry="9" fill="rgba(255,255,255,.28)" transform="rotate(-20)"/>`;}
function boneShape(len,th){
  const r=th*.62, hx=len/2;
  const parts=`<rect x="${-hx}" y="${-th/2}" width="${len}" height="${th}" rx="${th*.2}"/>`+[[-1,-1],[-1,1],[1,-1],[1,1]].map(([sx,sy])=>`<circle cx="${sx*(hx-r*.35)}" cy="${sy*th*.45}" r="${r}"/>`).join('');
  return `<g fill="#c3a463" stroke="#c3a463" stroke-width="9" stroke-linejoin="round">${parts}</g><g fill="#f6ebcb">${parts}</g><rect x="${-hx+r}" y="${-th/2+4}" width="${len-2*r}" height="${th*.18}" rx="3" fill="rgba(255,255,255,.6)"/>`;
}
const cap2=(x1,y1,x2,y2,w,fill='#f6ebcb',ol='#c3a463')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ol}" stroke-width="${w+10}" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round"/><line x1="${x1-w*.2}" y1="${y1}" x2="${x2-w*.2}" y2="${y2}" stroke="rgba(255,255,255,.55)" stroke-width="${w*.2}" stroke-linecap="round"/>`;

const J={sh:[95,-195],el:[150,-60],wr:[185,62],hip:[45,112],kn:[55,215],an:[60,312],head:[0,-292]};
function silh(attr,wT,wA,wL,hr,headAttr){
  const L=(a,b,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke-width="${w}"/>`;
  const m=p=>[-p[0],p[1]];
  return `<g ${attr} stroke-linecap="round" stroke-linejoin="round">${L([0,-200],[0,70],wT)}${L(J.sh,J.el,wA)}${L(J.el,J.wr,wA*.85)}${L(m(J.sh),m(J.el),wA)}${L(m(J.el),m(J.wr),wA*.85)}${L(J.hip,J.kn,wL)}${L(J.kn,J.an,wL*.8)}${L(m(J.hip),m(J.kn),wL)}${L(m(J.kn),m(J.an),wL*.8)}<circle cx="0" cy="${J.head[1]}" r="${hr}" ${headAttr||''}/></g>`;
}
function floaters(n,seed,x0,x1,y0,y1){
  const R=mk(seed);let o='';
  for(let i=0;i<n;i++){
    const r=8+R()*30, x=x0+R()*(x1-x0), y=y0+R()*(y1-y0), d=(4+R()*4).toFixed(1), dl=(R()*3).toFixed(1);
    o+=`<g data-fx="float@${dl}/${d}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="rgba(110,235,222,${(.07+R()*.12).toFixed(2)})" stroke="rgba(170,255,240,.35)" stroke-width="2"/><circle cx="${f1(x+r*.2)}" cy="${f1(y+r*.1)}" r="${f1(r*.3)}" fill="rgba(160,140,255,.35)"/></g>`;
  }

  s.cues=s.cues.map(c=>Array.isArray(c)?{text:c[0],dur:c[1]}:{text:c});
  let acc=0;s.cs=[];
  s.cues.forEach(c=>{c.words=c.text.replace(/\*\*/g,'').trim().split(/\s+/).length;if(c.dur==null)c.dur=c.words/WPS+PAD;s.cs.push(acc);acc+=c.dur});
  s.cueEnd=acc;s.dur=acc+(s.tail==null?1.2:s.tail);
  s.start=i?SC[i-1].start+SC[i-1].dur:0;TOTAL=s.start+s.dur;
  s.anims=[];
});

const player=$('#player'),stage=$('#stage'),scenesEl=$('#scenes'),head=$('#head'),capEl=$('#cap');
function parseWhen(w,s){
  let m=/^c(\d+)(?:\+(-?[\d.]+))?$/.exec(w);if(m)return s.cs[+m[1]]+(+m[2]||0);
  m=/^e-([\d.]+)$/.exec(w);if(m)return s.dur-(+m[1]);
  return parseFloat(w);
}
SC.forEach((s,i)=>{
  const sec=document.createElement('section');sec.className='scene';
  sec.innerHTML=`<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${s.svg(s)}</svg>`;
  scenesEl.appendChild(sec);s.el=sec;
  const cache={};s.q=id=>cache[id]||(cache[id]=sec.querySelector('#'+id));
  sec.querySelectorAll('[data-fx]').forEach(el=>{
    const spec=el.dataset.fx.trim();if(!spec)return;
    spec.split(/\s+/).forEach(tok=>{
      const m=/^([A-Za-z0-9]+)@([^/\s]+)(?:\/([\d.]+))?$/.exec(tok);if(!m)return;
      let p=P[m[1]];if(!p){console.warn('no preset',m[1]);return}
      if(typeof p==='function')p=p(el);
      if(p.pre)p.pre(el);
      if(p.o)el.style.transformOrigin=p.o;
      const start=parseWhen(m[2],s),dur=m[3]?+m[3]:p.d;
      const a=el.animate(p.kf,{delay:start*1000,duration:dur*1000,fill:p.fill||'both',easing:p.e||'ease',iterations:p.loop?Infinity:1});
      a.pause();
      s.anims.push({a,delay:start*1000,end:p.loop?Infinity:(start+dur)*1000,last:null});
    });
  });
});

/* background sparks */
(()=>{const R=mk(99),box=$('#sparks');for(let i=0;i<26;i++){const d=document.createElement('div');d.className='spark';const z=2+R()*5;d.style.cssText=`left:${R()*1920}px;top:${300+R()*900}px;width:${z}px;height:${z}px;animation-duration:${14+R()*22}s;animation-delay:${-R()*30}s`;box.appendChild(d)}})();

/* ---------- voice ---------- */
const synth=window.speechSynthesis;let voice=null,voiceOn=true;
function pickVoice(){
  if(!synth)return;const vs=synth.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return;
  voice=vs.find(v=>/Aria|Jenny|Natural|Online|Sonia|Libby/i.test(v.name)&&/en-(US|GB)/i.test(v.lang))||vs.find(v=>/Google US English/i.test(v.name))||vs.find(v=>/Zira|Samantha|Allison|Ava/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs[0];
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speak(text){
  if(!synth||!voiceOn)return;synth.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/\*\*/g,''));
  if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=clamp(speed*.95,.5,2);u.pitch=1;u.volume=1;
  synth.speak(u);
}

/* ---------- player state ---------- */
let T0=0,_lastSec=-1,t=0,playing=false,speed=1,cur=-1,lastKey=-1,lastWordIdx=-1,ccOn=true,ended=false,lastNow=0,idleTimer=0;
const ICO_PLAY='<svg viewBox="0 0 24 24"><path class="f" d="M7 4.2v15.6a1 1 0 0 0 1.5.9l13-7.8a1 1 0 0 0 0-1.7l-13-7.8A1 1 0 0 0 7 4.2z"/></svg>';
const ICO_PAUSE='<svg viewBox="0 0 24 24"><rect class="f" x="6" y="4" width="4.5" height="16" rx="1.2"/><rect class="f" x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
const bPlay=$('#bPlay');bPlay.innerHTML=ICO_PLAY;

/* progress bar segments */
const bar=$('#bar'),tip=$('#tip');
SC.forEach((s,i)=>{const d=document.createElement('div');d.className='seg';d.style.flexGrow=s.dur;d.innerHTML='<i></i>';bar.appendChild(d);s.seg=d;s.fill=d.firstChild});
const fmt=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const chapName=s=>s.title||'Introduction';

function setScene(i){
  if(cur>=0)SC[cur].el.style.opacity=0;
  cur=i;const s=SC[i];
  s.anims.forEach(o=>o.last=null);
  stage.style.setProperty('--accent',s.acc);document.documentElement.style.setProperty('--accent',s.acc);
  head.style.display=s.kicker?'block':'none';
  if(s.kicker){head.firstChild.textContent=s.kicker;head.lastChild.textContent=s.title;head.classList.remove('in');void head.offsetWidth;head.classList.add('in')}
  $('#chap').textContent=(i?String(i).padStart(2,'0')+' · ':'')+chapName(s);
  MD.emit('chapter',{chuong:i,ten:chapName(s),tong_chuong:SC.length});
}
function buildCap(ci,s){
  const c=s.cues[ci],parts=c.text.split('**');let html='';
  parts.forEach((p,k)=>{p.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w))html+=w;else html+=`<span class="w${k%2?' k':''}">${w}</span>`})});
  capEl.innerHTML=html;capEl._w=[...capEl.querySelectorAll('.w')];lastWordIdx=-1;
}
function render(){
  const tt=clamp(t,0,TOTAL-.001);
  let si=SC.length-1;for(let i=0;i<SC.length;i++){if(tt<SC[i].start+SC[i].dur){si=i;break}}
  if(si!==cur)setScene(si);
  const s=SC[si],lt=tt-s.start,ms=lt*1000;
  for(const o of s.anims){
    if(o.last!==null&&((ms<=o.delay&&o.last<=o.delay)||(ms>=o.end&&o.last>=o.end)))continue;
    o.a.currentTime=ms;o.last=ms;
  }
  s.el.style.opacity=clamp(Math.min(lt/.45,(s.dur-lt)/.5),0,1)*1;
  if(si===0&&lt<.45)s.el.style.opacity=1;
  s.tick&&s.tick(lt,s);
  /* captions */
  let ci=0;for(let k=0;k<s.cs.length;k++)if(lt>=s.cs[k])ci=k;
  const key=si*100+ci;
  if(key!==lastKey){lastKey=key;buildCap(ci,s);if(playing)speak(s.cues[ci].text)}
  const c=s.cues[ci],prog=(lt-s.cs[ci])/Math.max(.1,c.dur-PAD*.4),n=Math.floor(clamp(prog,0,1)*capEl._w.length+.999);
  if(n!==lastWordIdx){lastWordIdx=n;capEl._w.forEach((w,k)=>w.classList.toggle('on',k<n))}
  capEl.parentNode.style.opacity=(lt>s.cueEnd+.9&&si>0&&si<SC.length-1)?0:1;
  /* bar */
  SC.forEach((x,i)=>{x.fill.style.width=(tt>=x.start+x.dur?100:tt<=x.start?0:(tt-x.start)/x.dur*100)+'%'});
  $('#time').textContent=fmt(tt)+' / '+fmt(TOTAL);
}
function frame(now){
  if(player.clientWidth!==_fw)fit();
  const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;
  if(playing){
    t+=dt*speed;
    if(t>=TOTAL-.05){t=TOTAL-.05;pause(true);ended=true;$('#endcard').classList.remove('hide');MD.emit('progress',{t:f1(TOTAL),tong:f1(TOTAL),pct:100});MD.emit('ended')}
  }
  render();
  if(playing){const sec=Math.floor(t);if(sec!==_lastSec){_lastSec=sec;MD.emit('progress',{t:f1(t),tong:f1(TOTAL),pct:Math.round(t/TOTAL*100)})}}
  requestAnimationFrame(frame);
}
function play(){
  if(ended){t=0;ended=false;lastKey=-1}
  $('#poster').classList.add('hide');$('#endcard').classList.add('hide');
  playing=true;stage.classList.remove('paused');player.classList.add('playing');bPlay.innerHTML=ICO_PAUSE;
  if(synth&&synth.paused)synth.resume();
  poke();MD.emit('play',{t:f1(t)});
}
function pause(silent){
  const was=playing;
  playing=false;stage.classList.add('paused');player.classList.remove('playing');bPlay.innerHTML=ICO_PLAY;
  if(synth&&synth.speaking)synth.pause();
  if(was)MD.emit('pause',{t:f1(t)});
}
function seek(x){
  t=clamp(x,0,TOTAL-.06);ended=false;$('#endcard').classList.add('hide');
  if(synth)synth.cancel();lastKey=-1;
  if(!playing&&!$('#poster').classList.contains('hide')){/* poster stays */}
  render();
}
function togglePlay(){playing?pause():play()}
function skipScene(d){const i=clamp((cur<0?0:cur)+d,0,SC.length-1);seek(SC[i].start+.02);if(!playing&&!$('#poster').classList.contains('hide'))return}
function poke(){player.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>player.classList.add('idle'),2600)}

/* ---------- UI wiring ---------- */
bPlay.onclick=togglePlay;
$('#bBack').onclick=()=>seek(t-5);
$('#poster').onclick=()=>{t=T0;lastKey=-1;play()};
$('#endcard').onclick=()=>{t=0;ended=false;lastKey=-1;play()};
stage.onclick=togglePlay;
$('#bCC').onclick=()=>{ccOn=!ccOn;stage.classList.toggle('nocc',!ccOn);$('#bCC').classList.toggle('off',!ccOn)};
$('#bVoice').onclick=()=>{voiceOn=!voiceOn;$('#bVoice').classList.toggle('off',!voiceOn);if(!voiceOn&&synth)synth.cancel();else lastKey=-1};
const SPEEDS=[.75,1,1.25,1.5];
$('#spd').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('#spd').textContent=speed+'×';if(synth)synth.cancel();lastKey=-1};
$('#bFull').onclick=()=>{const w=$('#wrap');if(document.fullscreenElement)document.exitFullscreen();else (w.requestFullscreen||w.webkitRequestFullscreen).call(w)};
/* scrub bar */
let drag=false;
const barT=e=>{const r=bar.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*TOTAL};
const segAt=x=>{for(let i=0;i<SC.length;i++)if(x<SC[i].start+SC[i].dur)return SC[i];return SC[SC.length-1]};
bar.addEventListener('pointerdown',e=>{drag=true;bar.classList.add('drag');bar.setPointerCapture(e.pointerId);const x=barT(e);if($('#poster').classList.contains('hide')===false){$('#poster').classList.add('hide')}seek(x)});
bar.addEventListener('pointermove',e=>{
  const x=barT(e);if(drag)seek(x);
  const pr=player.getBoundingClientRect();tip.style.display='block';tip.style.left=clamp(e.clientX-pr.left,60,pr.width-60)+'px';
  tip.textContent=fmt(x)+'  ·  '+chapName(segAt(x));
});
bar.addEventListener('pointerup',e=>{drag=false;bar.classList.remove('drag')});
bar.addEventListener('pointerleave',()=>{tip.style.display='none'});
player.addEventListener('mousemove',poke);player.addEventListener('touchstart',poke,{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON'&&e.code==='Space')e.preventDefault();
  const k=e.key.toLowerCase();
  if(e.code==='Space'||k==='k'){e.preventDefault();if(!$('#poster').classList.contains('hide')){t=T0;lastKey=-1}togglePlay()}
  else if(e.key==='ArrowRight')seek(t+5);else if(e.key==='ArrowLeft')seek(t-5);
  else if(k==='f')$('#bFull').click();else if(k==='c')$('#bCC').click();else if(k==='m')$('#bVoice').click();
  else if(e.key==='.'||e.key===']')skipScene(1);else if(e.key===','||e.key==='[')skipScene(-1);
  else if(e.key==='Home')seek(0);else if(e.key==='End')seek(TOTAL-1);
  poke();
});
let _fw=0;function fit(){_fw=player.clientWidth;stage.style.transform=`scale(${_fw/1920})`}
window.addEventListener('resize',fit);fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(player);
window.addEventListener('beforeunload',()=>synth&&synth.cancel());

/* debug / testing hooks */
window.__video={seek,SC,get total(){return TOTAL},get t(){return t},get playing(){return playing},play,pause};
poke();
t=5.2;render();requestAnimationFrame(n=>{lastNow=n;frame(n)});

/* ---------- tuỳ chọn trên link + nhắn tin với trang mẹ (myDocument) ----------
   ?t=60 bắt đầu từ giây 60 · ?cc=0 tắt phụ đề · ?voice=0 tắt lồng tiếng · ?toc=1.25 tốc độ */
(()=>{
  const q=MD.q;
  if(q.get('cc')==='0')$('#bCC').click();
  if(q.get('voice')==='0')$('#bVoice').click();
  const sp=parseFloat(q.get('toc'));if(SPEEDS.includes(sp)){speed=sp;$('#spd').textContent=sp+'×'}
  const st=parseFloat(q.get('t'));if(st>0)T0=clamp(st,0,TOTAL-.5);
  MD.onLenh((lenh,m)=>{
    if(lenh==='play'){if(!$('#poster').classList.contains('hide')){t=T0;lastKey=-1}play()}
    else if(lenh==='pause')pause();
    else if(lenh==='seek'&&isFinite(m.t))seek(+m.t);
    else if(lenh==='chuong'&&SC[m.i|0])seek(SC[m.i|0].start+.02);
  });
  MD.emit('ready',{tong:f1(TOTAL),tong_chuong:SC.length});
})();
</script>
</body>
</html>
